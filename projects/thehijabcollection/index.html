<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hijab Collection | NexPage</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- NAVBAR -->
  <header class="navbar">
    <div class="logo">Hijab Collection</div>
    <nav>
      <a href="#">Home</a>
      <a href="#">Shop</a>
      <a href="#">About</a>
      <a href="#">Contact</a>
    </nav>
  </header>

  <!-- HERO SECTION -->
  <section class="hero">
    <img src="images/hero.jpg" alt="Hijab Collection Hero">
    <div class="hero-text">
      <h1>Elegant Hijabs for Every Occasion</h1>
      <p>Shop our latest collection of modest fashion</p>
      <a href="#products" class="btn">Shop Now</a>
    </div>
  </section>

  <!-- PRODUCTS -->
  <section id="products" class="products">
    <h2>Featured Products</h2>
    <div class="product-grid">
      <div class="product-card">
        <img src="images/product1.jpg" alt="Product 1">
        <h3>Classic Hijab</h3>
        <p>$20</p>
      </div>
      <div class="product-card">
        <img src="images/product2.jpg" alt="Product 2">
        <h3>Printed Hijab</h3>
        <p>$22</p>
      </div>
      <div class="product-card">
        <img src="images/product3.jpg" alt="Product 3">
        <h3>Ombre Hijab</h3>
        <p>$25</p>
      </div>
    </div>
  </section>

  <!-- FOOTER -->
  <footer>
    <p>&copy; 2026 Hijab Collection | Designed by NexPage</p>
  </footer>

</body>
</html>
